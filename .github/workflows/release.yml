name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: preview
  push:
    tags: [ 'v*' ]

jobs:
  macos:
    runs-on: macOS-latest
    steps:
    - name: Checkout Git Repo
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Install Qt
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
      with:
          target: desktop
          version: '5.15.2'

    - name: Build tiNspired Qt on macOS
      run: |
        set -e
        mkdir build
        cd build
        qmake .. && make -j4
        macdeployqt tiNspired.app -qmldir=../qml
        mkdir -p /tmp/tiNspired_macOS/
        mv tiNspired.app /tmp/tiNspired_macOS/

    - name: Create the DMG
      run: |
          brew install create-dmg || brew install create-dmg # we try twice because sometimes it fails...
          createDmgArgs="--volname 'tiNspired_macOS' \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 64 \
              --icon 'tiNspired.app' 125 200 \
              --app-drop-link 400 200 \
              'tiNspired_macOS.dmg' \
              '/tmp/tiNspired_macOS/'"
          eval "create-dmg $createDmgArgs" || eval "create-dmg $createDmgArgs" # retry just in case...

    - uses: actions/upload-artifact@v7
      with:
          name: tiNspired_macOS
          path: tiNspired_macOS.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
    - name: Checkout Git Repo
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Install Qt
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw81'
        tools: 'tools_mingw,qt.tools.win64_mingw810'
        cache: true

    - name: Fixup PATH
      run: |
        echo "$env:IQTA_TOOLS/mingw810_32/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "$env:IQTA_TOOLS/mingw810_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build tiNspired
      run: |
        mkdir build
        cd build
        qmake ..
        mingw32-make -j4
        mkdir tiNspired
        mv release/tiNspired.exe tiNspired/
        windeployqt --qmldir=../qml --no-qmltooling tiNspired/tiNspired.exe
        Compress-Archive -Path tiNspired -DestinationPath ../tiNspired_windows-x64.zip

    - uses: actions/upload-artifact@v7
      with:
          name: tiNspired_windows-x64
          path: tiNspired_windows-x64.zip
          if-no-files-found: error

  release:
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        path: dist
        merge-multiple: true

    - uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        files: dist/*
        prerelease: ${{ !startsWith(github.event.inputs.tag || github.ref_name, 'v') }}
        overwrite_files: true
        generate_release_notes: true
